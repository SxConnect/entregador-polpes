# =====================================================================
# Stack Separada e Independente: entregador-polpes (PWA + API)
#
# Esta stack é OPCIONAL e fica separada do painel e do cardápio.
# Subdomínio PWA: https://entregador.polpes.com.br
# Imagem: ghcr.io/sxconnect/entregador-polpes:latest
# =====================================================================

version: "3.8"

services:

  # ── Banco de Dados Dedicado de Entregas ─────────────────────────────
  entregador-db:
    image: postgres:16-alpine
    container_name: entregador-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: entregador
      POSTGRES_PASSWORD: entregador_secret_troque_aqui
      POSTGRES_DB: entregador_polpes
    volumes:
      - entregador-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entregador -d entregador_polpes"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - proxy

  # ── App do Entregador (Backend Fastify + PWA Integrado) ──────────────
  entregador-app:
    image: ghcr.io/sxconnect/entregador-polpes:latest
    container_name: entregador-app
    restart: unless-stopped
    depends_on:
      entregador-db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=4001
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://entregador:entregador_secret_troque_aqui@entregador-db:5432/entregador_polpes?schema=public
      - JWT_SECRET=sua_chave_jwt_super_secreta_minimo_32_caracteres_polpes
      - COURIER_SESSION_EXPIRES_IN=30d
      - PWA_BASE_URL=https://entregador.polpes.com.br
      - TRACKING_BASE_URL=https://entregador.polpes.com.br/t
    volumes:
      - entregador-uploads:/app/uploads
    ports:
      - "127.0.0.1:4002:4001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:4001/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=portainer_default"
      - "traefik.http.services.entregador-app.loadbalancer.server.port=4001"

      # ── Router HTTPS (websecure) ──
      - "traefik.http.routers.entregador-app.rule=Host(`entregador.polpes.com.br`)"
      - "traefik.http.routers.entregador-app.entrypoints=websecure"
      - "traefik.http.routers.entregador-app.service=entregador-app"
      - "traefik.http.routers.entregador-app.tls.certresolver=leresolver"

      # ── Router HTTP (web) com redirecionamento automático para HTTPS ──
      - "traefik.http.routers.entregador-app-http.rule=Host(`entregador.polpes.com.br`)"
      - "traefik.http.routers.entregador-app-http.entrypoints=web"
      - "traefik.http.routers.entregador-app-http.middlewares=entregador-redirect-https"
      - "traefik.http.middlewares.entregador-redirect-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.entregador-redirect-https.redirectscheme.permanent=true"

volumes:
  entregador-pgdata:
    driver: local
  entregador-uploads:
    driver: local

networks:
  proxy:
    external: true
    name: portainer_default
