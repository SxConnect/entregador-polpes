# =====================================================================
# entregador-polpes — Stack para Portainer + Traefik
# Subdomínio PWA e API: https://entregador.polpes.com.br
#
# Imagem: ghcr.io/sxconnect/entregador-polpes:latest
# Banco:  PostgreSQL 16 (serviço `db` interno da stack)
# Rede:   portainer_default (rede externa do Traefik na VPS)
# =====================================================================

services:

  # ── Banco de Dados PostgreSQL ───────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: entregador-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: entregador
      POSTGRES_PASSWORD: entregador_secret_troque_aqui
      POSTGRES_DB: entregador_polpes
    volumes:
      - entregador-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entregador -d entregador_polpes"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - proxy

  # ── App (Backend Fastify + PWA Integrado) ───────────────────────────
  app:
    image: ghcr.io/sxconnect/entregador-polpes:latest
    container_name: entregador-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=4001
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://entregador:entregador_secret_troque_aqui@db:5432/entregador_polpes?schema=public
      - JWT_SECRET=sua_chave_jwt_super_secreta_minimo_32_caracteres_polpes
      - COURIER_SESSION_EXPIRES_IN=30d
      - PWA_BASE_URL=https://entregador.polpes.com.br
      - TRACKING_BASE_URL=https://entregador.polpes.com.br/t
    volumes:
      - entregador-uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=portainer_default"
      - "traefik.http.services.entregador-app.loadbalancer.server.port=4001"

      # ── Roteador Traefik HTTPS com Let's Encrypt ───────────────────
      - "traefik.http.routers.entregador-app.rule=Host(`entregador.polpes.com.br`)"
      - "traefik.http.routers.entregador-app.entrypoints=websecure"
      - "traefik.http.routers.entregador-app.service=entregador-app"
      - "traefik.http.routers.entregador-app.tls.certresolver=leresolver"

volumes:
  entregador-pgdata:
    driver: local
  entregador-uploads:
    driver: local

networks:
  proxy:
    external: true
    name: portainer_default
