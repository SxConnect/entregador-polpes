version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: entregador-polpes-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: entregador
      POSTGRES_PASSWORD: entregador_secret
      POSTGRES_DB: entregador_polpes
    ports:
      - "5437:5432"
    volumes:
      - entregador-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entregador -d entregador_polpes"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  entregador-pgdata:
